name: ci

# Repository source/structural CI for GKSA-10, GKSA-11, GKSA-12 and GKSA-14.
#
# This workflow only runs Python-standard-library source, manifest/structure and
# negative CLI checks on hosted runners. It does NOT build native code, does NOT
# build the plugin against game assemblies, and does NOT run or validate the
# game. The native reference assemblies are deliberately unavailable here, so no
# compile or fake-assembly build is attempted. Every uploaded report is a
# source/structure/negative report and must never be read as a game passing, and
# no scenario in any ticket manifest is executed by this workflow.
on:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev

permissions:
  contents: read

jobs:
  source-and-structure:
    name: source and structure checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Show Python version
        run: python3 --version

      - name: Compile helper scripts (stdlib only)
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/pycache
        run: |
          python3 -m py_compile \
            tools/source_check.py \
            tools/local_build.py \
            tools/package.py \
            tests/e2e/verify.py

      # Source-tool CLI acceptance cases run BEFORE the source guard is relied on.
      # Every case indexes a disposable COPY of this repository's own versioned
      # files inside the runner temp directory, because the CLI enumerates
      # git ls-files. The fixtures are source-policy negative inputs only: they are
      # not native/game stubs, not runtime captures, not unit tests and not a game
      # harness, and they are never committed or uploaded. The matrix proves the
      # narrow technical-registration exemption cannot mask any other duplicate copy:
      # same file, another file, another constant, a duplicated declaration, a
      # declaration or attribute dropped or turned into a line/block comment or an
      # ordinary/verbatim string, an attribute moved to another class, and a
      # non-canonical PluginName value all still fail; another approved sentence and
      # a trailing comment still fail; and only the unchanged canonical registration
      # attached to the plugin class passes.
      - name: Source-tool CLI acceptance matrix (GKSA-12)
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/pycache
        run: |
          python3 - <<'PY'
          import json
          import os
          import shutil
          import subprocess
          import sys
          from pathlib import Path

          repo = Path.cwd().resolve()
          script = repo / "tools" / "source_check.py"
          reports = repo / "artifacts" / "ci"
          reports.mkdir(parents=True, exist_ok=True)
          fixture_root = Path(os.environ.get("RUNNER_TEMP") or "/tmp") / "gksa-source-fixtures"
          shutil.rmtree(fixture_root, ignore_errors=True)
          fixture_root.mkdir(parents=True, exist_ok=True)

          plugin_rel = "src/GK2.SermonReminder/SermonReminderPlugin.cs"
          project_rel = "src/GK2.SermonReminder/GK2.SermonReminder.csproj"
          manifest_rel = "tests/e2e/gksa12.json"
          locale_rels = (
              "src/GK2.SermonReminder/Localization/gksr.en.json",
              "src/GK2.SermonReminder/Localization/gksr.zh_cn.json",
          )
          base_rels = (plugin_rel, project_rel, *locale_rels, manifest_rel)

          attribute_line = "    [BepInPlugin(PluginGuid, PluginName, PluginVersion)]"
          declaration_line = '        public const string PluginName = "GK2 Sermon Reminder";'
          title = "GK2 Sermon Reminder"
          ready_copy = "Sermon Day!"


          def read(rel):
              return (repo / rel).read_text(encoding="utf-8")


          def inject(text, block):
              index = text.rstrip().rfind("}")
              return text[:index] + block + "\n" + text[index:]


          def replace_once(text, old, new):
              if old not in text:
                  raise SystemExit("fixture marker not found")
              return text.replace(old, new, 1)


          def mutate_inline_title(text):
              return inject(text, '        private string Title() { return "%s"; }' % title)


          def mutate_other_constant(text):
              return inject(text, '        private const string DisplayTitle = "%s";' % title)


          def mutate_duplicate_declaration(text):
              return inject(text, '        public const string PluginName = "%s";' % title)


          def mutate_drop_attribute(text):
              return text.replace(attribute_line, "")


          def mutate_other_approved_copy(text):
              return inject(text, '        private const string ReadyCopy = "%s";' % ready_copy)


          def mutate_comment_copy(text):
              return inject(text, "        // manifest copy illustrated here only: " + ready_copy)


          def mutate_attribute_in_line_comment(text):
              return replace_once(text, attribute_line, "    // " + attribute_line.strip())


          def mutate_attribute_in_block_comment(text):
              return replace_once(text, attribute_line, "    /* " + attribute_line.strip() + " */")


          def mutate_attribute_in_string(text):
              return replace_once(
                  text,
                  attribute_line,
                  '    private readonly string registrationNote = "' + attribute_line.strip() + '";',
              )


          def mutate_attribute_in_verbatim_string(text):
              return replace_once(
                  text,
                  attribute_line,
                  '    private readonly string registrationNote = @"' + attribute_line.strip() + '";',
              )


          def mutate_commented_declaration(text):
              return replace_once(text, declaration_line, "        // " + declaration_line.strip())


          def mutate_noncanonical_value(text):
              return replace_once(
                  text,
                  declaration_line,
                  '        public const string PluginName = "%s";' % ready_copy,
              )


          def mutate_attribute_on_other_class(text):
              text = replace_once(text, attribute_line + "\n", "")
              return inject(
                  text,
                  "    [BepInPlugin(PluginGuid, PluginName, PluginVersion)]\n"
                  "    internal sealed class OtherRegistration\n"
                  "    {\n"
                  "    }",
              )


          extra_other_file = {
              "src/GK2.SermonReminder/ExtraCopy.cs": (
                  "internal static class ExtraCopy\n"
                  "{\n"
                  '    internal const string Title = "%s";\n'
                  "}\n" % title
              ),
          }

          cases = (
              ("a", None, None, True, None),
              ("b", mutate_inline_title, None, False, title),
              ("c", None, extra_other_file, False, title),
              ("d", mutate_other_constant, None, False, title),
              ("e", mutate_duplicate_declaration, None, False, title),
              ("f", mutate_drop_attribute, None, False, title),
              ("g", mutate_other_approved_copy, None, False, ready_copy),
              ("h", mutate_comment_copy, None, False, ready_copy),
              ("i", mutate_attribute_in_line_comment, None, False, title),
              ("j", mutate_attribute_in_block_comment, None, False, title),
              ("k", mutate_attribute_in_string, None, False, title),
              ("l", mutate_attribute_in_verbatim_string, None, False, title),
              ("m", mutate_commented_declaration, None, False, title),
              ("n", mutate_noncanonical_value, None, False, ready_copy),
              ("o", mutate_attribute_on_other_class, None, False, title),
          )

          results = []
          failures = []
          for case, mutate, extra, expect_pass, expected_sentence in cases:
              fixture = fixture_root / case
              shutil.rmtree(fixture, ignore_errors=True)
              for rel in base_rels:
                  target = fixture / rel
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_text(read(rel), encoding="utf-8")
              plugin_text = read(plugin_rel)
              if mutate is not None:
                  plugin_text = mutate(plugin_text)
              (fixture / plugin_rel).write_text(plugin_text, encoding="utf-8")
              for rel, text in (extra or {}).items():
                  target = fixture / rel
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_text(text, encoding="utf-8")
              subprocess.run(["git", "init", "-q", str(fixture)], check=True)
              subprocess.run(["git", "-C", str(fixture), "add", "-A"], check=True)

              output = reports / ("source-check-matrix-%s.json" % case)
              completed = subprocess.run(
                  [
                      sys.executable, str(script),
                      "--repo-root", str(fixture),
                      "--project", project_rel,
                      "--manifest", manifest_rel,
                      "--output", str(output),
                  ],
                  capture_output=True, text=True,
              )
              report = json.loads(output.read_text(encoding="utf-8"))
              hits = report.get("sentencesInCode") or []
              ok = report.get("ok") is True
              if expect_pass:
                  passed = completed.returncode == 0 and ok
              else:
                  passed = completed.returncode == 2 and not ok and any(
                      expected_sentence in hit for hit in hits
                  )
              results.append({
                  "case": case,
                  "expectation": "pass" if expect_pass else "fail",
                  "exit": completed.returncode,
                  "ok": ok,
                  "sentencesInCode": hits,
                  "expectedSentence": expected_sentence,
                  "passed": passed,
              })
              if not passed:
                  failures.append("case %s: exit=%s ok=%s hits=%s" % (case, completed.returncode, ok, hits))

          summary = {
              "artifactVersion": 1,
              "kind": "gksa12-source-tool-acceptance-matrix",
              "assertion": "source-policy-only",
              "e2eVerdict": None,
              "ok": not failures,
              "cases": results,
              "failures": failures,
              "note": (
                  "Source-policy CLI acceptance cases only. No native build, no game "
                  "execution and no E2E verdict; every fixture is a disposable copy of this "
                  "repository's own versioned files under the runner temp directory. Cases "
                  "i-o prove that only genuine C# registration code (never a comment, char "
                  "or string literal) attached to the plugin class, and only the canonical "
                  "technical name, earn the exemption."
              ),
          }
          (reports / "source-check-matrix.json").write_text(
              json.dumps(summary, ensure_ascii=False, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )

          if failures:
              for failure in failures:
                  sys.stderr.write("FAIL [matrix] " + failure + "\n")
              sys.stderr.write("RESULT: FAIL (source-tool acceptance matrix, fail-closed)\n")
              raise SystemExit(1)

          sys.stderr.write(
              "RESULT: PASS (source-tool acceptance matrix; %d cases; no game execution asserted)\n"
              % len(results)
          )
          PY

      # The guard default is the latest implemented specification (GKSA-14), but the
      # metadata and settings coverage from GKSA-12 stays explicit: both manifests
      # are checked so a regression in either ticket's finalText or catalog pairing
      # fails. ``--manifest`` overrides the default per invocation.
      - name: Source and resource guard (GKSA-12 and GKSA-14 manifests)
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/pycache
        run: |
          set -euo pipefail
          for ticket in gksa12 gksa14; do
            python3 tools/source_check.py \
              --repo-root . \
              --manifest "tests/e2e/${ticket}.json" \
              --output "artifacts/ci/source-check-${ticket}.json"
          done

      - name: Manifest structural check (GKSA-10, GKSA-11, GKSA-12 and GKSA-14)
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/pycache
        run: |
          set -euo pipefail
          for ticket in gksa10 gksa11 gksa12 gksa14; do
            python3 tests/e2e/verify.py \
              --manifest "tests/e2e/${ticket}.json" \
              --check-manifest \
              --output "artifacts/ci/manifest-${ticket}.json"
          done

      - name: Negative check - missing capture is rejected (four tickets)
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/pycache
        run: |
          set -euo pipefail
          for ticket in gksa10 gksa11 gksa12 gksa14; do
            capture="tests/e2e/no-such-capture-${ticket}.json"
            test ! -e "$capture"
            set +e
            python3 tests/e2e/verify.py \
              --manifest "tests/e2e/${ticket}.json" \
              --capture "$capture" \
              --output "artifacts/ci/reject-missing-${ticket}.json"
            status=$?
            set -e
            echo "reject-missing-${ticket} exit code: $status"
            test "$status" -eq 2
            python3 -c "import json,sys; d=json.load(open('artifacts/ci/reject-missing-${ticket}.json')); sys.exit(0 if d.get('ok') is False else 1)"
          done

      - name: Negative check - example capture is rejected (four tickets)
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/pycache
        run: |
          set -euo pipefail
          for pair in "gksa10 capture.example.json" "gksa11 capture.gksa11.example.json" "gksa12 capture.gksa12.example.json" "gksa14 capture.gksa14.example.json"; do
            set -- $pair
            ticket=$1
            example=$2
            set +e
            python3 tests/e2e/verify.py \
              --manifest "tests/e2e/${ticket}.json" \
              --capture "tests/e2e/${example}" \
              --output "artifacts/ci/reject-example-${ticket}.json"
            status=$?
            set -e
            echo "reject-example-${ticket} exit code: $status"
            test "$status" -eq 2
            python3 -c "import json,sys; d=json.load(open('artifacts/ci/reject-example-${ticket}.json')); sys.exit(0 if d.get('ok') is False else 1)"
          done

      # Bounded negative CLI checks that prove ticket binding, not game support.
      # Each manifest is fed a minimal malformed capture whose supported kind is a
      # real '-e2e-capture' kind belonging to a DIFFERENT ticket. A plain '-example'
      # kind would be rejected as unsupported, which would not exercise the ticket
      # mismatch, so the other ticket's real kind is used deliberately, and the
      # assertion requires the specific ticket-mismatch diagnostic rather than any
      # error. All twelve ordered pairs among GKSA-10/11/12/14 are covered. The inputs
      # live outside the uploaded report paths, are explicitly labelled negative-only,
      # and model no game execution whatsoever.
      - name: Negative check - cross-ticket capture is rejected (twelve ordered pairs)
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/pycache
        run: |
          set -euo pipefail
          negative_dir="artifacts/ci/negative-inputs"
          mkdir -p "$negative_dir"
          for source in gksa10 gksa11 gksa12 gksa14; do
            python3 -c "import json,sys; json.dump({'kind': sys.argv[1] + '-e2e-capture', 'captureVersion': 1, '_note': 'NEGATIVE CLI CHECK ONLY - intentionally malformed opposite-ticket capture; proves ticket binding and describes no game execution'}, open(sys.argv[2], 'w'), indent=2, sort_keys=True)" "$source" "${negative_dir}/negative-${source}.json"
          done
          for pair in \
            "gksa10 gksa11" "gksa10 gksa12" "gksa10 gksa14" \
            "gksa11 gksa10" "gksa11 gksa12" "gksa11 gksa14" \
            "gksa12 gksa10" "gksa12 gksa11" "gksa12 gksa14" \
            "gksa14 gksa10" "gksa14 gksa11" "gksa14 gksa12"; do
            set -- $pair
            target=$1
            source=$2
            report="artifacts/ci/reject-cross-${target}-from-${source}.json"
            set +e
            python3 tests/e2e/verify.py \
              --manifest "tests/e2e/${target}.json" \
              --capture "${negative_dir}/negative-${source}.json" \
              --output "$report" 2>/dev/null
            status=$?
            set -e
            echo "reject-cross-${target}-from-${source} exit code: $status"
            test "$status" -eq 2
            python3 -c "import json,sys; d=json.load(open(sys.argv[1])); msg=(d.get('error') or {}).get('message',''); sys.exit(0 if d.get('ok') is False and 'does not match manifest ticket' in msg else 1)" "$report"
          done

      - name: Upload structural reports (not a game pass)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gksa10-gksa11-gksa12-gksa14-source-structure-reports
          path: |
            artifacts/ci/source-check-matrix.json
            artifacts/ci/source-check-gksa12.json
            artifacts/ci/source-check-gksa14.json
            artifacts/ci/manifest-gksa10.json
            artifacts/ci/manifest-gksa11.json
            artifacts/ci/manifest-gksa12.json
            artifacts/ci/manifest-gksa14.json
            artifacts/ci/reject-missing-gksa10.json
            artifacts/ci/reject-missing-gksa11.json
            artifacts/ci/reject-missing-gksa12.json
            artifacts/ci/reject-missing-gksa14.json
            artifacts/ci/reject-example-gksa10.json
            artifacts/ci/reject-example-gksa11.json
            artifacts/ci/reject-example-gksa12.json
            artifacts/ci/reject-example-gksa14.json
            artifacts/ci/reject-cross-gksa10-from-gksa11.json
            artifacts/ci/reject-cross-gksa10-from-gksa12.json
            artifacts/ci/reject-cross-gksa10-from-gksa14.json
            artifacts/ci/reject-cross-gksa11-from-gksa10.json
            artifacts/ci/reject-cross-gksa11-from-gksa12.json
            artifacts/ci/reject-cross-gksa11-from-gksa14.json
            artifacts/ci/reject-cross-gksa12-from-gksa10.json
            artifacts/ci/reject-cross-gksa12-from-gksa11.json
            artifacts/ci/reject-cross-gksa12-from-gksa14.json
            artifacts/ci/reject-cross-gksa14-from-gksa10.json
            artifacts/ci/reject-cross-gksa14-from-gksa11.json
            artifacts/ci/reject-cross-gksa14-from-gksa12.json
          if-no-files-found: error
